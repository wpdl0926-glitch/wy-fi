<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 7 손가락 인식 카메라</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    
    <style>
        html {
            background-color: #000;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        body { 
            position: relative;
            height: 100vh;
            max-width: calc(100vh * (9 / 16)); 
            width: 100%;
            aspect-ratio: 9 / 16;
            margin: 0; 
            padding: 0; 
            font-family: 'Pretendard', 'Segoe UI', sans-serif;
            overflow: hidden; 
            background-image: url('background.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat; 
        }

        video { display: none; } 

        .desktop-icons {
            position: absolute;
            top: 20px;
            left: 15px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            z-index: 10;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 80px; 
            padding: 4px;
            border-radius: 6px;
            cursor: pointer;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 50, 120, 0.8), 0 0 8px rgba(0, 100, 200, 0.4);
            font-size: 12px; 
            text-align: center;
            border: 1px solid transparent;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .desktop-icon:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .desktop-icon:hover .desktop-icon-img {
            transform: scale(1.08); 
        }

        .desktop-icon-img {
            width: 70px; 
            height: 70px;
            margin-bottom: 4px;
            object-fit: contain;
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 95%; 
            max-width: 450px;
            background: rgba(220, 235, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            box-shadow: 
                inset 0 0 5px rgba(255, 255, 255, 0.8),
                inset 0 1px 1px rgba(255, 255, 255, 1),
                0 10px 30px rgba(0, 30, 80, 0.3); 
            padding: 6px;
            backdrop-filter: blur(8px);
            z-index: 300; 
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 28px;
            margin-bottom: 4px;
            padding: 0 4px;
            color: #002244;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8), 0 0 10px rgba(255, 255, 255, 1);
            font-weight: 600;
            font-size: 14px;
        }

        .window-controls {
            display: flex;
            gap: 2px;
        }
        .window-controls div {
            width: 28px;
            height: 18px;
            border: 1px solid rgba(0, 50, 100, 0.2);
            border-radius: 3px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(200,210,220,0.5));
            box-shadow: inset 0 1px 1px rgba(255,255,255,1);
            cursor: default;
        }
        .window-controls .close-btn {
            background: linear-gradient(to bottom, rgba(255,150,150,0.8), rgba(200,30,30,0.7));
            border-color: rgba(100, 0, 0, 0.3);
            cursor: pointer;
        }
        .window-controls .close-btn:hover {
            background: linear-gradient(to bottom, rgba(255,100,100,0.9), rgba(220,20,20,0.8));
        }

        .content-area {
            background-color: #000;
            border: 1px solid rgba(0, 50, 100, 0.5);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        canvas { 
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
        }

        .bubble {
            position: absolute;
            top: 0; left: 0;
            width: 180px; 
            height: 180px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.7) 0%, 
                rgba(200, 255, 255, 0.4) 20%, 
                rgba(255, 200, 255, 0.3) 40%, 
                rgba(255, 255, 200, 0.2) 60%, 
                rgba(100, 200, 255, 0.4) 80%, 
                rgba(255, 255, 255, 0.6) 100%);
            box-shadow: 
                inset 0 0 25px rgba(255, 255, 255, 0.9),
                inset 15px 0 40px rgba(255, 150, 255, 0.3),
                inset -15px -15px 40px rgba(0, 150, 255, 0.5),
                0 10px 25px rgba(0, 40, 100, 0.15); 
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: brightness(1.05);
            pointer-events: none; 
            z-index: 50; 
            will-change: transform;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 10%; left: 15%;
            width: 35%; height: 25%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(-45deg);
            border-radius: 50%;
        }

        .bubble::after {
            content: '';
            position: absolute;
            bottom: 8%; right: 10%;
            width: 60%; height: 25%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(150,220,255,0.6) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(-30deg);
        }

        #audio-hint {
            position: absolute;
            background: linear-gradient(to bottom, #FFFFE1, #FFFFA5);
            border: 1px solid rgba(0, 50, 100, 0.3); 
            padding: 8px 12px;
            border-radius: 3px;
            font-size: 14px;
            color: #002244;
            box-shadow: 2px 2px 5px rgba(0, 40, 100, 0.2);
            z-index: 450;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        #typing-game-ui {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 500;
        }

        #falling-words-container {
            position: relative; 
            width: 100%; 
            height: calc(100% - 60px); 
            overflow: hidden;
        }

        .falling-word {
            position: absolute;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8), 0 0 10px rgba(0,150,255,0.8);
            background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(150,220,255,0.1) 100%);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 1), 0 4px 10px rgba(0, 60, 140, 0.2);
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }

        .typing-input-wrapper {
            position: absolute; 
            bottom: 20px; 
            width: 100%;
            display: flex; 
            justify-content: center;
        }

        #typing-input {
            width: 70%; 
            max-width: 250px;
            padding: 10px 15px;
            font-size: 15px; 
            font-family: 'Pretendard', sans-serif;
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 20px; 
            outline: none;
            background: rgba(255,255,255,0.8);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,1);
            text-align: center;
            color: #002244;
            transition: all 0.3s;
        }

        #typing-input:focus { 
            background: rgba(255,255,255,1); 
            border-color: #56aaff; 
        }

        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(10, 30, 60, 0.4);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 200;
        }

        .taskbar-right {
            display: flex;
            align-items: center;
            height: 100%;
            padding-right: 15px;
        }

        .systray-icons {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-right: 15px;
            font-size: 16px;
        }

        /* 바탕화면 아이콘과 동일한 텍스트/호버 스타일 적용 */
        .taskbar-time {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 4px 10px;
            border-radius: 6px;
            color: #ffffff;
            text-shadow: 0 1px 3px rgba(0, 50, 120, 0.8), 0 0 8px rgba(0, 100, 200, 0.4);
            font-size: 12px;
            border: 1px solid transparent;
            transition: background-color 0.2s ease, border-color 0.2s ease;
            cursor: default;
        }

        .taskbar-time:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .start-button {
            width: 48px; 
            height: 48px;
            margin-left: 15px;
            object-fit: contain;
            cursor: pointer;
            filter: drop-shadow(0 0 6px rgba(0,50,150,0.5));
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .start-button:hover {
            transform: scale(1.1);
        }

        .wifi-window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70%; 
            max-width: 300px; 
            background: rgba(240, 248, 255, 0.9); 
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            box-shadow: 
                inset 0 0 4px rgba(255, 255, 255, 1),
                0 8px 25px rgba(0, 40, 100, 0.25);
            padding: 20px; 
            backdrop-filter: blur(10px);
            z-index: 150;
            font-size: 14px; 
            color: #002244;
            transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            will-change: top, left, transform, width, padding, opacity;
        }

        /* ★ 숨겨지는 로직에 대한 추가 스타일 (보안코드 입력 후 사라질 때 사용) */
        .wifi-window.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -40%) scale(0.9);
        }

        .wifi-window.minimized {
            top: 100%;
            left: 100%;
            transform: translate(calc(-100% - 15px), calc(-100% - 70px)); 
            width: 55%; 
            max-width: 220px; 
            padding: 12px;
        }

        .wifi-title { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); font-weight: bold; font-size: 15px; color: #0044aa; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(0, 50, 150, 0.1); }
        .wifi-window.minimized .wifi-title { font-size: 13px; margin-bottom: 8px; padding-bottom: 6px; }

        .wifi-network-name { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); font-weight: bold; font-size: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; color: #002244; }
        .wifi-window.minimized .wifi-network-name { font-size: 14px; }

        .wifi-icon-img { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); height: 22px; width: auto; vertical-align: middle; }
        .wifi-window.minimized .wifi-icon-img { height: 18px; }

        .wifi-content p { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); margin: 6px 0; color: #003366; font-size: 13px; }
        .wifi-window.minimized .wifi-content p { margin: 4px 0; font-size: 11px; }

        .wifi-input { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; margin-top: 6px; margin-bottom: 14px; border: 1px solid rgba(0, 100, 200, 0.3); border-radius: 6px; outline: none; background: rgba(255, 255, 255, 0.8); color: #002244; }
        .wifi-window.minimized .wifi-input { padding: 5px; font-size: 12px; margin-bottom: 10px; }

        .wifi-input:focus { border-color: #56aaff; box-shadow: 0 0 5px rgba(86, 170, 255, 0.6); }

        .wifi-btn { transition: all 0.7s cubic-bezier(0.16, 1, 0.3, 1); display: block; width: 80px; padding: 7px 0; font-size: 13px; font-weight: bold; color: #0044aa; margin-left: auto; background: linear-gradient(to bottom, #ffffff, #eaf4ff); border: 1px solid rgba(0, 100, 200, 0.3); border-radius: 6px; cursor: pointer; font-family: inherit; }
        .wifi-window.minimized .wifi-btn { width: 60px; padding: 5px 0; font-size: 12px; }

        .wifi-btn:hover { background: linear-gradient(to bottom, #eaf6fd, #cce8ff); border-color: #56aaff; }

        /* 틀렸을 때 흔들리는 애니메이션 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }
        .shake {
            animation: shake 0.4s;
            border-color: #ff5555 !important;
            box-shadow: 0 0 8px rgba(255, 85, 85, 0.6) !important;
        }
    </style>
</head>
<body>

    <div class="desktop-icons">
        <div class="desktop-icon">
            <img src="joo.png" alt="Joo" class="desktop-icon-img">
            <span>Jooeun</span>
        </div>
        <div class="desktop-icon">
            <img src="dae.png" alt="Dae" class="desktop-icon-img">
            <span>Daewoong</span>
        </div>
        <div class="desktop-icon">
            <img src="yun.png" alt="Yun" class="desktop-icon-img">
            <span>Yunseo</span>
        </div>
        <div class="desktop-icon">
            <img src="su.png" alt="Su" class="desktop-icon-img">
            <span>Sua</span>
        </div>
        <div class="desktop-icon">
            <img src="jun.png" alt="Jun" class="desktop-icon-img">
            <span>Junha</span>
        </div>
    </div>

    <div class="window" id="camera-window" style="display: none;">
        <div class="title-bar">
            <span id="camera-title"></span>
            <div class="window-controls">
                <div></div>
                <div></div>
                <div class="close-btn" id="close-camera"></div>
            </div>
        </div>

        <div class="content-area">
            <div id="audio-hint">💡 시스템 사운드 활성화를 위해 화면을 한 번 클릭하세요.</div>
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" width="1280" height="720"></canvas>
            
            <div id="typing-game-ui" style="display: none;">
                <div id="falling-words-container"></div>
                <div class="typing-input-wrapper">
                    <input type="text" id="typing-input" placeholder="위 단어를 입력하고 엔터를 누르세요" autocomplete="off" />
                </div>
            </div>
        </div>
    </div>

    <div class="wifi-window" id="wifi-window">
        <div class="wifi-title">무선 네트워크 연결</div>
        <div class="wifi-content">
            <div class="wifi-network-name">
                <img src="wyfi.png" alt="Wi-Fi" class="wifi-icon-img" /> 
                <span>WY-FI</span>
            </div>
            <p>네트워크 보안 키를 입력하십시오.</p>
            <!-- ★ 타입 text로 변경하여 쉽게 치도록 수정 및 ID 부여 -->
            <input type="text" id="wifi-pw" placeholder="보안 키 입력" class="wifi-input" autocomplete="off" />
            <button class="wifi-btn" id="wifi-connect-btn">연결</button>
        </div>
    </div>

   <div class="taskbar">
        <div class="taskbar-left">
            <img src="whale.png" alt="Whale Start" class="start-button">
        </div>
        <div class="taskbar-right">
            <div class="systray-icons">
                <span class="systray-icon">📶</span>
                <span class="systray-icon">🔊</span>
                <span class="systray-icon">🔋</span>
            </div>
            <div class="taskbar-time">
                <div id="time-text">오후 12:00</div>
                <div id="date-text">2026-08-16</div>
            </div>
        </div>
    </div>

    <script>
        document.body.addEventListener('click', () => {
            document.getElementById('audio-hint').style.opacity = '0';
            setTimeout(() => { document.getElementById('audio-hint').style.display = 'none'; }, 300);
        });

        // ==========================================
        // ★ 실시간 시계 작동 로직
        // ==========================================
        function updateSystemTime() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? '오후' : '오전';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // 0시는 12시로 표기
            
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            
            document.getElementById('time-text').innerText = `${ampm} ${hours}:${minutes}`;
            document.getElementById('date-text').innerText = `${year}-${month}-${day}`;
        }
        setInterval(updateSystemTime, 1000);
        updateSystemTime();

        // ==========================================
        // ★ 와이파이 보안코드 입력 로직 추가
        // ==========================================
        const wifiPwInput = document.getElementById('wifi-pw');
        const wifiConnectBtn = document.getElementById('wifi-connect-btn');
        const wifiWindow = document.getElementById('wifi-window'); 

        function handleWifiConnect() {
            if (wifiPwInput.value === 'Whale and Yonsei') {
                wifiWindow.classList.add('hidden'); // 정답 시 창 사라짐
                wifiPwInput.value = ''; 
            } else {
                // 오답 시 흔들림 애니메이션과 입력창 비우기
                wifiPwInput.classList.add('shake');
                wifiPwInput.value = '';
                wifiPwInput.placeholder = '다시 입력해주세요';
                setTimeout(() => wifiPwInput.classList.remove('shake'), 400);
            }
        }

        // 입력창 클릭 이벤트 전파 방지 (바탕화면 클릭과 안 겹치도록)
        wifiPwInput.addEventListener('click', (e) => e.stopPropagation());

        wifiPwInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                handleWifiConnect();
            }
        });

        wifiConnectBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            handleWifiConnect();
        });


        const memberMentions = {
            'Jooeun': { left:  ['안녕하세요', '저는', '기획자', '김주은'], right: ['우리는','섬세한', '연세대', '입니다'] },
            'Daewoong': { left:  ['반갑습니다', '저는', '개발자', '김대웅'], right: ['논리적인', '웨일과', '팀', '입니다'] },
            'Yunseo': { left:  ['안녕하세요', '저는', 'PM', '이윤서'], right: ['우리는', '전략적인', '연결하는', '입니다'] },
            'Sua': { left:  ['안녕하세요', '저는', '마케터', '수아입니다'], right: ['우리는', '감각적인', '연세대를', 'WY-Fi'] },
            'Junha': { left:  ['반갑습니다', '저는', '디자이너', '준하입니다'], right: ['우리는', '웨일', '연세대', '팀원'] }
        };

        let currentSelectedMember = 'Jooeun'; 

        const icons = document.querySelectorAll('.desktop-icon');
        const cameraWindow = document.getElementById('camera-window');
        const cameraTitle = document.getElementById('camera-title');
        const closeCameraBtn = document.getElementById('close-camera');

        const typingGameUI = document.getElementById('typing-game-ui');
        const fallingWordsContainer = document.getElementById('falling-words-container');
        const typingInput = document.getElementById('typing-input');
        
        let typingGameInterval;
        let fallingWordsList = [];
        let wordSpawnTimer;
        
        let currentWordIndex = 0; 
        
        const junhaWordsToType = ['반갑습니다', '저는', '소통하는', '디자이너', '채준하입니다'];

        function startTypingGame() {
            typingGameUI.style.display = 'block';
            typingInput.value = '';
            setTimeout(() => typingInput.focus(), 100); 
            
            fallingWordsList = [];
            fallingWordsContainer.innerHTML = '';
            
            currentWordIndex = 0; 
            
            wordSpawnTimer = setInterval(() => {
                if (currentWordIndex >= junhaWordsToType.length) {
                    clearInterval(wordSpawnTimer);
                    return;
                }

                const wordText = junhaWordsToType[currentWordIndex];
                currentWordIndex++;

                const wordEl = document.createElement('div');
                wordEl.className = 'falling-word';
                wordEl.innerText = wordText;
                
                const startX = Math.random() * 60 + 10; 
                wordEl.style.left = `${startX}%`;
                wordEl.style.top = `-50px`;
                
                fallingWordsContainer.appendChild(wordEl);
                fallingWordsList.push({ el: wordEl, text: wordText, y: -50 });
            }, 2500);

            typingGameInterval = setInterval(() => {
                const speed = 1.5; 
                for (let i = fallingWordsList.length - 1; i >= 0; i--) {
                    let fw = fallingWordsList[i];
                    fw.y += speed;
                    fw.el.style.top = `${fw.y}px`;
                    
                    if (fw.y > fallingWordsContainer.clientHeight + 50) {
                        fw.el.remove();
                        fallingWordsList.splice(i, 1);
                    }
                }
            }, 30);
        }

        function stopTypingGame() {
            typingGameUI.style.display = 'none';
            clearInterval(wordSpawnTimer);
            clearInterval(typingGameInterval);
            fallingWordsContainer.innerHTML = '';
            fallingWordsList = [];
        }

        typingInput.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                const val = typingInput.value.trim();
                if (!val) return;

                const matchIndex = fallingWordsList.findIndex(fw => fw.text === val);
                if (matchIndex !== -1) {
                    playAudio(val); 
                    fallingWordsList[matchIndex].el.remove(); 
                    fallingWordsList.splice(matchIndex, 1);
                }
                typingInput.value = ''; 
            }
        });

        icons.forEach(icon => {
            icon.addEventListener('click', (e) => {
                e.stopPropagation();
                const iconName = icon.querySelector('span').innerText;
                cameraTitle.innerText = iconName; 
                currentSelectedMember = iconName; 
                cameraWindow.style.display = 'block'; 

                // ★ 기존의 축소되는 클래스(minimized) 로직을 보안 창이 열려있을 때만 작동하도록 방어
                if (!wifiWindow.classList.contains('hidden')) {
                    wifiWindow.classList.add('minimized');
                }

                if (currentSelectedMember === 'Junha') {
                    startTypingGame();
                } else {
                    stopTypingGame();
                }
            });
        });

        closeCameraBtn.addEventListener('click', () => {
            cameraWindow.style.display = 'none'; 
            wifiWindow.classList.remove('minimized');
            stopTypingGame(); 
        });

        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const MINT_COLOR = '#33FFBB'; 
        const TIP_CIRCLE_RADIUS = 4;

        let wave = { active: false, progress: 0, opacity: 0 };
        let wasBothHandsOpen = false;

        let gestureTracking = {
            'Right': { currentRaw: '', stabilized: '', startTime: 0 },
            'Left': { currentRaw: '', stabilized: '', startTime: 0 }
        };
        const STABILIZE_TIME_MS = 250; 

        let lastPlayedTime = {};
        const COOLDOWN_MS = 500; 

        let lastPrayingDetectTime = 0;

        const audioFiles = {
            '우리는': 'we', '웨일': 'whale', '연세대': 'yonsei', '팀원': 'team',
            'WY-FI': 'wyfi', '연결하는': 'connect',
            '안녕하세요': 'hello', '반갑습니다': 'nicetomeetyou', '저는': 'iam',
            '기획자': 'planner', '개발자': 'developer', '마케터': 'marketer', '디자이너': 'designer', 'PM': 'pm',
            '주은입니다': 'jooeun', '대웅입니다': 'daewoong', '윤서입니다': 'yunseo', '수아입니다': 'sua', '준하입니다': 'junha'
        };

        const preloadedAudios = {};
        for (const [text, fileName] of Object.entries(audioFiles)) {
            const audio = new Audio(`${fileName}.m4a`);
            audio.preload = 'auto'; 
            audio.volume = 1.0;
            preloadedAudios[text] = audio;
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function checkFingers(landmarks) {
            const isThumbOpen = getDistance(landmarks[4], landmarks[17]) > getDistance(landmarks[3], landmarks[17]);
            const isIndexOpen = landmarks[8].y < landmarks[6].y;
            const isMiddleOpen = landmarks[12].y < landmarks[10].y;
            const isRingOpen = landmarks[16].y < landmarks[14].y;
            const isPinkyOpen = landmarks[20].y < landmarks[18].y;

            return { isThumbOpen, isIndexOpen, isMiddleOpen, isRingOpen, isPinkyOpen };
        }

        function checkPinches(landmarks) {
            const thumbTip = landmarks[4];
            const pinchThreshold = 0.06; 

            return {
                thumbAndIndex: getDistance(thumbTip, landmarks[8]) < pinchThreshold,
                thumbAndMiddle: getDistance(thumbTip, landmarks[12]) < pinchThreshold,
                thumbAndRing: getDistance(thumbTip, landmarks[16]) < pinchThreshold,
                thumbAndPinky: getDistance(thumbTip, landmarks[20]) < pinchThreshold
            };
        }

        function drawMintCircle(ctx, x, y, radius) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fillStyle = MINT_COLOR;
            ctx.fill();
        }

        function playAudio(text) {
            const now = Date.now();
            if (lastPlayedTime[text] && (now - lastPlayedTime[text] < COOLDOWN_MS)) {
                return;
            }
            lastPlayedTime[text] = now;
            
            const audio = preloadedAudios[text];
            if (!audio) return; 

            audio.currentTime = 0;
            let playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => {
                    console.log("오디오 재생 에러 무시:", e);
                });
            }
        }

        const BUBBLE_COUNT = 5;
        const BUBBLE_SIZE = 180;
        const bubbles = [];

        for (let i = 0; i < BUBBLE_COUNT; i++) {
            const bEl = document.createElement('div');
            bEl.className = 'bubble';
            document.body.appendChild(bEl);
            
            bubbles.push({
                el: bEl,
                x: Math.random() * (document.body.clientWidth - BUBBLE_SIZE), 
                y: Math.random() * (document.body.clientHeight - BUBBLE_SIZE),
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4
            });
        }

        function animateBubbles() {
            const cw = document.body.clientWidth;
            const ch = document.body.clientHeight;

            bubbles.forEach(b => {
                b.x += b.vx;
                b.y += b.vy;

                if (b.x <= 0) { b.x = 0; b.vx *= -1; }
                if (b.y <= 0) { b.y = 0; b.vy *= -1; }
                if (b.x + BUBBLE_SIZE >= cw) { b.x = cw - BUBBLE_SIZE; b.vx *= -1; }
                if (b.y + BUBBLE_SIZE >= ch) { b.y = ch - BUBBLE_SIZE; b.vy *= -1; }

                b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
            });

            requestAnimationFrame(animateBubbles);
        }
        animateBubbles();

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        
        hands.setOptions({
            selfieMode: false,
            maxNumHands: 2,           
            modelComplexity: 1,
            minDetectionConfidence: 0.5, 
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            try {
                canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
                
                canvasCtx.save();
                canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
                canvasCtx.restore();

                const now = Date.now();
                const handsData = [];
                let isLeftFistActive = false;
                let isPraying = false;

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    
                    if (results.multiHandLandmarks.length === 2) {
                        const h1 = results.multiHandLandmarks[0];
                        const h2 = results.multiHandLandmarks[1];
                        
                        const wristDist = getDistance(h1[0], h2[0]);
                        const palmDist = getDistance(h1[9], h2[9]);
                        
                        if (wristDist < 0.25 && palmDist < 0.25) {
                            lastPrayingDetectTime = now;
                            isPraying = true;
                        } else {
                            isPraying = (now - lastPrayingDetectTime < 1000);
                        }
                    }

                    for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                        const landmarks = results.multiHandLandmarks[i];
                        const handednessObj = results.multiHandedness[i];
                        if (!handednessObj) continue; 
                        
                        const handedness = handednessObj.label; 
                        const fingers = checkFingers(landmarks);
                        const pinches = checkPinches(landmarks); 

                        const isFist = !fingers.isThumbOpen && !fingers.isIndexOpen && !fingers.isMiddleOpen && !fingers.isRingOpen && !fingers.isPinkyOpen;
                        
                        if (handedness === 'Left' && isFist) {
                            isLeftFistActive = true;
                        }

                        handsData.push({ landmarks, handedness, fingers, pinches, isFist });
                    }

                    for (const hand of handsData) {
                        const mapX = (x) => x * canvasElement.width;
                        const mapY = (y) => y * canvasElement.height;
                        
                        const pinchedIndices = [];
                        if (hand.pinches.thumbAndIndex) pinchedIndices.push(4, 8);
                        else if (hand.pinches.thumbAndMiddle) pinchedIndices.push(4, 12);
                        else if (hand.pinches.thumbAndRing) pinchedIndices.push(4, 16);
                        else if (hand.pinches.thumbAndPinky) pinchedIndices.push(4, 20);

                        for (const idx of pinchedIndices) {
                            const tipLandmark = hand.landmarks[idx];
                            drawMintCircle(canvasCtx, mapX(tipLandmark.x), mapY(tipLandmark.y), TIP_CIRCLE_RADIUS * 1.5);
                        }

                        let rawText = "";
                        const mentions = memberMentions[currentSelectedMember] || memberMentions['Jooeun'];

                        if (currentSelectedMember !== 'Junha') {
                            if (isPraying) {
                                rawText = "연결하는";
                            } else {
                                if (hand.handedness === 'Left') {
                                    if (hand.isFist) rawText = "WY-FI";
                                    else if (hand.pinches.thumbAndIndex) rawText = mentions.left[0];
                                    else if (hand.pinches.thumbAndMiddle) rawText = mentions.left[1];
                                    else if (hand.pinches.thumbAndRing) rawText = mentions.left[2];
                                    else if (hand.pinches.thumbAndPinky) rawText = mentions.left[3];
                                } 
                                else if (hand.handedness === 'Right') {
                                    if (hand.pinches.thumbAndIndex) rawText = mentions.right[0];
                                    else if (hand.pinches.thumbAndMiddle) rawText = mentions.right[1];
                                    else if (hand.pinches.thumbAndRing) rawText = mentions.right[2];
                                    else if (hand.pinches.thumbAndPinky) rawText = mentions.right[3];
                                }
                            }
                        }

                        let tracker = gestureTracking[hand.handedness];
                        if (!tracker) {
                            gestureTracking[hand.handedness] = { currentRaw: '', stabilized: '', startTime: 0 };
                            tracker = gestureTracking[hand.handedness];
                        }

                        if (rawText !== tracker.currentRaw) {
                            tracker.currentRaw = rawText;
                            tracker.startTime = now;
                        } else {
                            if (rawText !== "" && rawText !== tracker.stabilized) {
                                if (now - tracker.startTime >= STABILIZE_TIME_MS) {
                                    tracker.stabilized = rawText;
                                    playAudio(rawText);
                                }
                            } else if (rawText === "") {
                                tracker.stabilized = "";
                            }
                        }

                        let displayText = tracker.stabilized;

                        if (displayText !== "") {
                            canvasCtx.font = "500 45px Pretendard"; 
                            canvasCtx.textAlign = "center";
                            canvasCtx.textBaseline = "middle";
                            canvasCtx.fillStyle = "white"; 

                            const handX = hand.landmarks[0].x; 
                            const handY = hand.landmarks[8].y; 
                            const textX = handX * canvasElement.width;
                            const textY = handY * canvasElement.height - 50; 

                            canvasCtx.fillText(displayText, textX, textY);
                        }
                    }
                }

                const isWyFiCondition = (currentSelectedMember !== 'Junha' && isLeftFistActive && !isPraying);
                if (isWyFiCondition && !wasBothHandsOpen) {
                    wave.active = true;
                    wave.progress = 0;
                    wave.opacity = 0.8; 
                }
                wasBothHandsOpen = isWyFiCondition;

                if (wave.active) {
                    wave.progress += 6;     
                    wave.opacity -= 0.005;  

                    if (wave.opacity <= 0) {
                        wave.active = false;
                    } else {
                        canvasCtx.save();
                        const w = canvasElement.width;
                        const h = canvasElement.height;

                        canvasCtx.fillStyle = `rgba(150, 230, 255, ${wave.opacity * 0.5})`;
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(0, h);
                        let baseY1 = h + 100 - wave.progress * 1.2;
                        for(let x = 0; x <= w; x += 20) {
                            let y = baseY1 + Math.sin(x * 0.005 + wave.progress * 0.08) * 80 + Math.cos(x * 0.011 - wave.progress * 0.04) * 30;
                            canvasCtx.lineTo(x, y);
                        }
                        canvasCtx.lineTo(w, h);
                        canvasCtx.fill();

                        canvasCtx.fillStyle = `rgba(100, 200, 255, ${wave.opacity * 0.8})`;
                        canvasCtx.beginPath();
                        canvasCtx.moveTo(0, h);
                        let baseY2 = h + 150 - wave.progress * 1.5;
                        for(let x = 0; x <= w; x += 20) {
                            let y = baseY2 + Math.sin(x * 0.006 + wave.progress * 0.06 + 2) * 60 + Math.cos(x * 0.008 - wave.progress * 0.07) * 40;
                            canvasCtx.lineTo(x, y);
                        }
                        canvasCtx.lineTo(w, h);
                        canvasCtx.fill();

                        canvasCtx.restore();
                    }
                }
            } catch (error) {
                console.error("Frame processing ignored an error to prevent freeze:", error);
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>
