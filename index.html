<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows 7 손가락 인식 카메라</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    
    <style>
        /* 기본 바탕화면 설정 */
        body { 
            margin: 0; 
            padding: 0; 
            width: 100vw;
            height: 100vh; 
            font-family: 'Pretendard', 'Segoe UI', sans-serif;
            overflow: hidden; 
            background-image: url('background.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat; 
        }

        /* 비디오 숨김 처리 */
        video { display: none; } 

        /* 바탕화면 아이콘 스타일 */
        .desktop-icons {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .desktop-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 74px;
            padding: 5px;
            border: 1px solid transparent;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            text-shadow: 1px 1px 2px black, 0 0 10px black;
            font-size: 12px;
            text-align: center;
            transition: background-color 0.1s, border-color 0.1s;
        }

        .desktop-icon:hover {
            background-color: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .icon-emoji {
            font-size: 40px;
            margin-bottom: 5px;
            filter: drop-shadow(2px 4px 4px rgba(0,0,0,0.5));
        }

        /* 윈도우 7 에어로 글래스(Aero Glass) 창 테마 */
        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            background: rgba(220, 235, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 8px;
            box-shadow: 
                inset 0 0 5px rgba(255, 255, 255, 0.8),
                inset 0 1px 1px rgba(255, 255, 255, 1),
                0 10px 30px rgba(0, 0, 0, 0.5);
            padding: 6px;
            backdrop-filter: blur(8px);
            z-index: 20;
        }

        /* 윈도우 7 타이틀 바 */
        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 28px;
            margin-bottom: 4px;
            padding: 0 4px;
            color: #000;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8), 0 0 10px rgba(255, 255, 255, 1);
            font-weight: 600;
            font-size: 14px;
        }

        /* 윈도우 창 제어 버튼들 */
        .window-controls {
            display: flex;
            gap: 2px;
        }
        .window-controls div {
            width: 28px;
            height: 18px;
            border: 1px solid rgba(0, 0, 0, 0.3);
            border-radius: 3px;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(200,210,220,0.5));
            box-shadow: inset 0 1px 1px rgba(255,255,255,1);
        }
        .window-controls .close-btn {
            background: linear-gradient(to bottom, rgba(255,150,150,0.8), rgba(200,30,30,0.7));
            border-color: rgba(100, 0, 0, 0.5);
        }

        /* 실제 카메라 화면이 그려질 영역 */
        .content-area {
            background-color: #000;
            border: 1px solid rgba(0, 0, 0, 0.7);
            border-radius: 3px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 캔버스 크기를 윈도우 창 안에 맞춤 */
        canvas { 
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 16 / 9;
        }

        /* 프루티거 에어로 스타일 무지갯빛 글래스 비눗방울 */
        .bubble {
            position: absolute;
            top: 0; left: 0;
            width: 220px;
            height: 220px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, 
                rgba(255, 255, 255, 0.7) 0%, 
                rgba(200, 255, 255, 0.4) 20%, 
                rgba(255, 200, 255, 0.3) 40%, 
                rgba(255, 255, 200, 0.2) 60%, 
                rgba(100, 200, 255, 0.4) 80%, 
                rgba(255, 255, 255, 0.6) 100%);
            box-shadow: 
                inset 0 0 25px rgba(255, 255, 255, 0.9),
                inset 15px 0 40px rgba(255, 150, 255, 0.3),
                inset -15px -15px 40px rgba(0, 150, 255, 0.5),
                0 10px 25px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: brightness(1.05);
            pointer-events: none; 
            z-index: 100; 
            will-change: transform;
        }

        .bubble::before {
            content: '';
            position: absolute;
            top: 10%; left: 15%;
            width: 35%; height: 25%;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(-45deg);
            border-radius: 50%;
        }

        .bubble::after {
            content: '';
            position: absolute;
            bottom: 8%; right: 10%;
            width: 60%; height: 25%;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(150,220,255,0.6) 0%, rgba(255,255,255,0) 70%);
            transform: rotate(-30deg);
        }

        /* 오디오 허용 안내 툴팁 */
        #audio-hint {
            position: absolute;
            background: linear-gradient(to bottom, #FFFFE1, #FFFFA5);
            border: 1px solid #000;
            padding: 8px 12px;
            border-radius: 3px;
            font-size: 14px;
            color: #000;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            z-index: 30;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        /* 윈도우 7 작업표시줄 */
        .taskbar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background: rgba(10, 20, 30, 0.5);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid rgba(0, 0, 0, 0.5);
            z-index: 200;
        }
        
        .start-button-mockup {
            width: 36px;
            height: 36px;
            background: radial-gradient(circle, rgba(100,150,255,0.8), rgba(20,50,150,0.8));
            border-radius: 50%;
            margin-left: 10px;
            border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        /* ★ 우측 하단 Wi-Fi 연결 창 (크기 확대) */
        .wifi-window {
            position: absolute;
            bottom: 50px; 
            right: 20px;
            width: 380px; /* 기존 260px -> 380px로 확대 */
            background: rgba(245, 249, 255, 0.9); 
            border: 1px solid rgba(150, 150, 150, 0.8);
            border-radius: 6px;
            box-shadow: 
                inset 0 0 3px rgba(255, 255, 255, 1),
                0 8px 25px rgba(0, 0, 0, 0.4);
            padding: 22px; /* 여백 확대 */
            backdrop-filter: blur(10px);
            z-index: 150;
            font-size: 15px; /* 전체 글자 크기 상향 */
            color: #333;
        }

        .wifi-title {
            font-weight: bold;
            font-size: 16px;
            color: #003399;
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(0, 0, 0, 0.15);
        }

        .wifi-network-name {
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .wifi-icon-img {
            height: 24px; /* 아이콘 크기 확대 */
            width: auto;
            vertical-align: middle;
        }

        .wifi-content p {
            margin: 8px 0;
            color: #444;
            font-size: 14px;
        }

        .wifi-input {
            width: 100%;
            box-sizing: border-box;
            padding: 9px;
            font-size: 15px;
            margin-top: 8px;
            margin-bottom: 16px;
            border: 1px solid #999;
            border-radius: 4px;
            outline: none;
        }

        .wifi-input:focus {
            border-color: #569de5;
            box-shadow: 0 0 5px #569de5;
        }

        .wifi-btn {
            display: block;
            width: 90px;
            padding: 8px 0;
            font-size: 14px;
            margin-left: auto;
            background: linear-gradient(to bottom, #f0f0f0, #e0e0e0);
            border: 1px solid #adadad;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
        }

        .wifi-btn:hover {
            background: linear-gradient(to bottom, #eaf6fd, #d9f0fc);
            border-color: #7eb4ea;
        }
    </style>
</head>
<body>

    <!-- 바탕화면 아이콘 -->
    <div class="desktop-icons">
        <div class="desktop-icon">
            <div class="icon-emoji">💻</div>
            <span>Computer</span>
        </div>
        <div class="desktop-icon">
            <div class="icon-emoji">🗑️</div>
            <span>Recycle Bin</span>
        </div>
        <div class="desktop-icon">
            <div class="icon-emoji">📁</div>
            <span>New Folder</span>
        </div>
        <div class="desktop-icon">
            <div class="icon-emoji">🌐</div>
            <span>Internet</span>
        </div>
        <div class="desktop-icon">
            <div class="icon-emoji">🎵</div>
            <span>Media</span>
        </div>
        <div class="desktop-icon">
            <div class="icon-emoji">🛡️</div>
            <span>Security</span>
        </div>
    </div>

    <!-- 중앙 윈도우 창 -->
    <div class="window">
        <div class="title-bar">
            <span></span>
            <div class="window-controls">
                <div></div>
                <div></div>
                <div class="close-btn"></div>
            </div>
        </div>

        <div class="content-area">
            <div id="audio-hint">💡 시스템 사운드 활성화를 위해 화면을 한 번 클릭하세요.</div>
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" width="1280" height="720"></canvas>
        </div>
    </div>

    <!-- 우측 하단 가짜 와이파이 연결 창 -->
    <div class="wifi-window">
        <div class="wifi-title">무선 네트워크 연결</div>
        <div class="wifi-content">
            <div class="wifi-network-name">
                <img src="wyfi.png" alt="Wi-Fi" class="wifi-icon-img" /> 
                <span>WY-FI</span>
            </div>
            <p>네트워크 보안 키를 입력하십시오.</p>
            <input type="password" placeholder="보안 키 입력" class="wifi-input" onclick="event.stopPropagation();" />
            <button class="wifi-btn" onclick="event.stopPropagation();">연결</button>
        </div>
    </div>

    <!-- 하단 작업표시줄 -->
    <div class="taskbar">
        <div class="start-button-mockup"></div>
    </div>

    <script>
        document.body.addEventListener('click', () => {
            document.getElementById('audio-hint').style.opacity = '0';
            setTimeout(() => { document.getElementById('audio-hint').style.display = 'none'; }, 300);
        });

        const videoElement = document.getElementById('video');
        const canvasElement = document.getElementById('canvas');
        const canvasCtx = canvasElement.getContext('2d');

        const MINT_COLOR = '#33FFBB'; 
        const TIP_CIRCLE_RADIUS = 4;

        let wave = { active: false, progress: 0, opacity: 0 };
        let wasBothHandsOpen = false;

        let gestureTracking = {
            'Right': { currentRaw: '', stabilized: '', startTime: 0 },
            'Left': { currentRaw: '', stabilized: '', startTime: 0 }
        };
        const STABILIZE_TIME_MS = 250; 

        let lastPlayedTime = {};
        const COOLDOWN_MS = 500; 

        // 오디오 파일매칭 맵
        const audioFiles = {
            '안녕하세요': 'hello',
            '제 이름은': 'myname',
            '저는': 'iam',
            '입니다': 'imnida',
            '개발자': 'developer',
            'PM': 'pm',
            '마케터': 'marketer',
            '디자이너': 'designer'
        };

        const preloadedAudios = {};
        for (const [text, fileName] of Object.entries(audioFiles)) {
            const audio = new Audio(`${fileName}.m4a`);
            audio.preload = 'auto'; 
            
            if (['개발자', 'PM', '마케터', '디자이너'].includes(text)) {
                audio.volume = 0.8;
            } else {
                audio.volume = 1.0;
            }
            preloadedAudios[text] = audio;
        }

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function checkFingers(landmarks) {
            const isThumbOpen = getDistance(landmarks[4], landmarks[17]) > getDistance(landmarks[3], landmarks[17]);
            const isIndexOpen = landmarks[8].y < landmarks[6].y;
            const isMiddleOpen = landmarks[12].y < landmarks[10].y;
            const isRingOpen = landmarks[16].y < landmarks[14].y;
            const isPinkyOpen = landmarks[20].y < landmarks[18].y;

            return { isThumbOpen, isIndexOpen, isMiddleOpen, isRingOpen, isPinkyOpen };
        }

        function drawMintCircle(ctx, x, y, radius) {
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, 2 * Math.PI);
            ctx.fillStyle = MINT_COLOR;
            ctx.fill();
        }

        function playAudio(text) {
            const now = Date.now();
            if (lastPlayedTime[text] && (now - lastPlayedTime[text] < COOLDOWN_MS)) {
                return;
            }
            lastPlayedTime[text] = now;
            
            const audio = preloadedAudios[text];
            if (!audio) return; 

            audio.currentTime = 0;
            audio.play().catch(e => {
                console.log("오디오 재생 실패:", e);
            });
        }

        // 비눗방울 애니메이션 로직
        const BUBBLE_COUNT = 5;
        const BUBBLE_SIZE = 220;
        const bubbles = [];

        for (let i = 0; i < BUBBLE_COUNT; i++) {
            const bEl = document.createElement('div');
            bEl.className = 'bubble';
            document.body.appendChild(bEl);
            
            bubbles.push({
                el: bEl,
                x: Math.random() * (window.innerWidth - BUBBLE_SIZE), 
                y: Math.random() * (window.innerHeight - BUBBLE_SIZE),
                vx: (Math.random() - 0.5) * 4,
                vy: (Math.random() - 0.5) * 4
            });
        }

        function animateBubbles() {
            const cw = window.innerWidth;
            const ch = window.innerHeight;

            bubbles.forEach(b => {
                b.x += b.vx;
                b.y += b.vy;

                if (b.x <= 0) { b.x = 0; b.vx *= -1; }
                if (b.y <= 0) { b.y = 0; b.vy *= -1; }
                if (b.x + BUBBLE_SIZE >= cw) { b.x = cw - BUBBLE_SIZE; b.vx *= -1; }
                if (b.y + BUBBLE_SIZE >= ch) { b.y = ch - BUBBLE_SIZE; b.vy *= -1; }

                b.el.style.transform = `translate(${b.x}px, ${b.y}px)`;
            });

            requestAnimationFrame(animateBubbles);
        }
        animateBubbles();

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        
        hands.setOptions({
            maxNumHands: 2,           
            modelComplexity: 1,
            minDetectionConfidence: 0.7, 
            minTrackingConfidence: 0.7
        });

        hands.onResults((results) => {
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            
            canvasCtx.save();
            canvasCtx.scale(-1, 1);
            canvasCtx.translate(-canvasElement.width, 0);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.restore();

            let fullOpenHandsCount = 0; 
            const now = Date.now();

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const handedness = results.multiHandedness[i].label; 
                    const fingers = checkFingers(landmarks);

                    const isAllFingersOpen = fingers.isThumbOpen && fingers.isIndexOpen && fingers.isMiddleOpen && fingers.isRingOpen && fingers.isPinkyOpen;
                    if (isAllFingersOpen) fullOpenHandsCount++;

                    const mapX = (x) => (1 - x) * canvasElement.width;
                    const mapY = (y) => y * canvasElement.height;
                    const fingerTips = [
                        { state: fingers.isThumbOpen, index: 4 },
                        { state: fingers.isIndexOpen, index: 8 },
                        { state: fingers.isMiddleOpen, index: 12 },
                        { state: fingers.isRingOpen, index: 16 },
                        { state: fingers.isPinkyOpen, index: 20 },
                    ];

                    for (const tip of fingerTips) {
                        if (tip.state) {
                            const tipLandmark = landmarks[tip.index];
                            drawMintCircle(canvasCtx, mapX(tipLandmark.x), mapY(tipLandmark.y), TIP_CIRCLE_RADIUS);
                        }
                    }

                    let rawText = "";

                    // 손가락 독립 개별 상태 조건
                    const onlyThumb = fingers.isThumbOpen && !fingers.isIndexOpen && !fingers.isMiddleOpen && !fingers.isRingOpen && !fingers.isPinkyOpen;
                    const onlyIndex = !fingers.isThumbOpen && fingers.isIndexOpen && !fingers.isMiddleOpen && !fingers.isRingOpen && !fingers.isPinkyOpen;
                    const onlyPinky = !fingers.isThumbOpen && !fingers.isIndexOpen && !fingers.isMiddleOpen && !fingers.isRingOpen && fingers.isPinkyOpen;

                    // ★ 제스처 조건 수정 (요청사항 반영)
                    // MediaPipe에서 'Left' = 사용자의 왼손
                    if (handedness === 'Left') {
                        if (isAllFingersOpen) {
                            rawText = "안녕하세요"; // 1. 모든 손가락 다 핌
                        } else if (onlyThumb) {
                            rawText = "제 이름은";   // 2. 엄지만 핌
                        } else if (onlyIndex) {
                            rawText = "저는";       // 3. 검지만 핌
                        } else if (onlyPinky) {
                            rawText = "입니다";     // 4. 새끼만 핌
                        }
                    }

                    let tracker = gestureTracking[handedness];

                    if (rawText !== tracker.currentRaw) {
                        tracker.currentRaw = rawText;
                        tracker.startTime = now;
                    } else {
                        if (rawText !== "" && rawText !== tracker.stabilized) {
                            if (now - tracker.startTime >= STABILIZE_TIME_MS) {
                                tracker.stabilized = rawText;
                                playAudio(rawText);
                            }
                        } else if (rawText === "") {
                            tracker.stabilized = "";
                        }
                    }

                    let displayText = tracker.stabilized;

                    if (displayText !== "") {
                        canvasCtx.font = "500 45px Pretendard"; 
                        canvasCtx.textAlign = "center";
                        canvasCtx.textBaseline = "middle";
                        canvasCtx.fillStyle = "white"; 

                        const handX = landmarks[0].x; 
                        const handY = landmarks[8].y; 
                        const textX = (1 - handX) * canvasElement.width;
                        const textY = handY * canvasElement.height - 50; 

                        canvasCtx.fillText(displayText, textX, textY);
                    }
                }
            }

            const isBothHandsOpen = (fullOpenHandsCount === 2);
            if (isBothHandsOpen && !wasBothHandsOpen) {
                wave.active = true;
                wave.progress = 0;
                wave.opacity = 0.8; 
            }
            wasBothHandsOpen = isBothHandsOpen;

            if (wave.active) {
                wave.progress += 8;     
                wave.opacity -= 0.008;  

                if (wave.opacity <= 0) {
                    wave.active = false;
                } else {
                    canvasCtx.save();
                    const w = canvasElement.width;
                    const h = canvasElement.height;

                    canvasCtx.fillStyle = `rgba(150, 230, 255, ${wave.opacity * 0.5})`;
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(0, h);
                    let baseY1 = h + 150 - wave.progress * 1.5;
                    for(let x = 0; x <= w; x += 20) {
                        let y = baseY1 + Math.sin(x * 0.005 + wave.progress * 0.05) * 50;
                        canvasCtx.lineTo(x, y);
                    }
                    canvasCtx.lineTo(w, h);
                    canvasCtx.fill();

                    canvasCtx.fillStyle = `rgba(100, 200, 255, ${wave.opacity * 0.8})`;
                    canvasCtx.beginPath();
                    canvasCtx.moveTo(0, h);
                    let baseY2 = h + 200 - wave.progress * 1.8;
                    for(let x = 0; x <= w; x += 20) {
                        let y = baseY2 + Math.sin(x * 0.006 + wave.progress * 0.04 + 2) * 40;
                        canvasCtx.lineTo(x, y);
                    }
                    canvasCtx.lineTo(w, h);
                    canvasCtx.fill();

                    canvasCtx.restore();
                }
            }
        });

        const camera = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 1280,
            height: 720
        });
        camera.start();
    </script>
</body>
</html>
